name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, test, e2e, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: teamcrm
          POSTGRES_PASSWORD: teamcrm
          POSTGRES_DB: teamcrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teamcrm" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: teamcrm
          RABBITMQ_DEFAULT_PASS: teamcrm
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 15s
          --health-timeout 10s --health-retries 5
    env:
      DATABASE_URL: postgres://teamcrm:teamcrm@localhost:5432/teamcrm
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://teamcrm:teamcrm@localhost:5672
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: '900'
      JWT_REFRESH_TTL: '2592000'
      CORS_ORIGIN: http://localhost:5173
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: teamcrm
      MINIO_ROOT_PASSWORD: teamcrm12345
      MINIO_BUCKET: teamcrm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MinIO (official image requires a command → run as step, not service)
        run: |
          # Образ тянем сначала с quay.io, и только потом с Docker Hub.
          #
          # Docker Hub стал отдавать анонимным сборкам «pull access denied for
          # minio/minio, repository does not exist» — на зелёном коде и без единой
          # правки рядом с хранилищем. Это лимит чужого реестра, а не наша поломка,
          # но чинить его нам: красный CI на исправной ветке хуже, чем лишняя
          # строчка здесь. quay.io — второй официальный адрес того же образа.
          IMAGE=""
          for candidate in quay.io/minio/minio:latest minio/minio:latest; do
            if docker pull "$candidate"; then IMAGE="$candidate"; break; fi
            echo "образ $candidate недоступен, пробуем следующий"
          done
          if [ -z "$IMAGE" ]; then echo "MinIO не скачался ни с одного зеркала"; exit 1; fi
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=teamcrm -e MINIO_ROOT_PASSWORD=teamcrm12345 \
            "$IMAGE" server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break || sleep 2
          done
          # Проверяем, что хранилище действительно поднялось: без этого e2e упадут
          # позже и непонятнее — на первом же вложении.
          curl -fsS http://localhost:9000/minio/health/live
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: migrate
        run: npm run migrate
      - name: e2e (live PG/Redis/RabbitMQ)
        run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend — lint, check, contrast, a11y, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: check (логика роутера, командной строки и кэша)
        run: npm run check
      - name: contrast (WCAG AA по обеим темам)
        run: npm run contrast
      - name: focus (видимое кольцо у всего кликабельного)
        run: npm run a11y
      - run: npm run build
      - name: build:mobile (тот же код в режиме телефона — ТЗ-9)
        run: npm run build:mobile

  deploy:
    name: Deploy to staging
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync code to server
        # --delete держит дерево сервера равным репозиторию: без него удалённый в git файл
        # остаётся на проде навсегда. Удаление работает только внутри backend/, frontend/
        # и nginx/ — .env, observability/, backups/, scripts/ лежат уровнем выше и не
        # затрагиваются. Два каталога внутри nginx/ живут на сервере и в git их нет:
        # certs/ (самоподписанный сертификат edge-nginx, без него nginx не стартует) и
        # html/.well-known/ (webroot ACME — снести его значит убить автопродление
        # сертификата teamsmrt.com). Оба защищены исключениями — с путём: голое
        # `.well-known` ловило и frontend/public/.well-known (App Links, AASA), и они
        # не доезжали до сервера.
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude coverage \
            --exclude .git --exclude '.env' --exclude 'nginx/certs' --exclude 'nginx/html/.well-known' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend frontend infra/docker-compose.yml infra/nginx infra/deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/teamcrm/"
      - name: Build & restart stack
        # Вся выкладка живёт в скрипте на сервере (infra/deploy/release.sh): в YAML ей
        # не место — там её не прочитать и не поправить. Скрипт ждёт окончания созвонов,
        # поднимает контейнеры до состояния healthy и МЯГКО перечитывает конфигурацию
        # nginx. Прежний `docker compose restart crm-edge` рвал все соединения разом,
        # и каждая выкладка обрывала созвоны и давала людям 502.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            bash /opt/teamcrm/deploy/release.sh
          '
