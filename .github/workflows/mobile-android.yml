name: Mobile — Android APK

# Оболочка Capacitor (ТЗ-9, волна 2): собираем веб-бандл в режиме capacitor, кладём его в
# нативный проект и собираем отладочный APK. Артефакт — для установки на телефон и проверки.
# Подписанный release-APK и раздача с сайта — волна 12.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # Capacitor CLI 8 требует Node ≥ 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/native/android/**/*.gradle', 'frontend/native/android/gradle/wrapper/gradle-wrapper.properties') }}
      - run: npm ci
      - name: Веб-бандл для оболочки
        run: npm run build:capacitor
      - name: Бандл и плагины → нативный проект
        run: npx cap sync android
      - name: Сборка APK
        working-directory: frontend/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anthill-android-debug
          path: frontend/native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14