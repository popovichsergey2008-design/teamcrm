# crm-web — отдаёт собранный React SPA с history-fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html всегда ревалидируется → новый деплой подхватывается без хард-рефреша
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # хэшированные ассеты — иммутабельны (имя меняется при каждой сборке)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
