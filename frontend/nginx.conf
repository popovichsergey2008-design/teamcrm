# crm-web — отдаёт собранный React SPA с history-fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html всегда ревалидируется → новый деплой подхватывается без хард-рефреша
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Файл с расширением оболочкой не подменяется: пропавшая иконка обязана отвечать
    # 404, а не отдавать html с кодом 200 — именно так пропажа знака выглядела
    # «работающей» и в браузере, и в проверке доступности.
    location ~* \.(svg|png|ico|jpg|jpeg|gif|webp|json|webmanifest|txt|xml|woff2?|map)$ {
        try_files $uri =404;
    }

    # Связь домена с мобильными приложениями (ТЗ-9): Android App Links и iOS Universal
    # Links. Файл Apple без расширения — тип отдаём явно, иначе octet-stream и Apple его
    # не примет. Кэш короткий: отпечаток ключа или team id меняются редко, но менять
    # их надо без ожидания суток.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные ассеты — иммутабельны (имя меняется при каждой сборке).
    # ^~ обязателен: без него регулярная локация выше перехватывала бы картинки
    # и шрифты из сборки, и они теряли бы заголовки кэша.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
