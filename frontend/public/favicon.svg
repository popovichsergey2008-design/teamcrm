<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TEAMCRM">
  <!--
    Знак вырос из самого логотипа: «TEAM» и отделённое цветом «CRM».
    Здесь то же самое, но фигурой — буква T, у которой правый конец перекладины
    оторван и стоит отдельным блоком. В 16 пикселях читается как «T с точкой»
    и не сливается с десятком синих квадратов в панели вкладок.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a67ff"/>
      <stop offset="1" stop-color="#1e57e6"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#g)"/>

  <!-- перекладина: обрывается, не доходя до правого края -->
  <rect x="7" y="9" width="12" height="3.6" rx="1.4" fill="#fff"/>
  <!-- ножка -->
  <rect x="11.2" y="9" width="3.6" height="14" rx="1.4" fill="#fff"/>
  <!-- оторванный конец — то самое «CRM», выделенное в логотипе -->
  <rect x="21.4" y="9" width="3.6" height="3.6" rx="1.4" fill="#fff" opacity=".85"/>
</svg>
