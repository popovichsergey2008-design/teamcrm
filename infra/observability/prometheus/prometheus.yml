global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Метрики самого приложения: очередь поддержки и обращения к модели.
  # Ходим через edge-nginx — он один знает, какой цвет сейчас живой (blue или green).
  - job_name: teamcrm-api
    static_configs:
      - targets: ["crm-edge:9113"]
