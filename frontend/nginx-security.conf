# Заголовки безопасности страниц приложения (мастер-план релиза §27).
#
# Подключается в server И в каждый location со своим add_header: nginx не наследует
# add_header уровнем выше, если в location есть хоть один свой, — без повторного include
# у index.html и /assets/ заголовков бы не было.
#
# frame-ancestors: нас можно встроить только себе, Telegram (Mini App в Telegram Web —
# это iframe на web.telegram.org) и сайту qevo.one. X-Frame-Options не ставим: списка
# адресов он не умеет, а с CSP современные браузеры его и не читают.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://qevo.one https://*.qevo.one" always;

# Полная политика пока только «в режиме отчёта»: браузер ничего не блокирует, а нарушения
# шлёт на /api/csp-report. Когда журнал неделю будет пустым — переводить в боевую.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://telegram.org; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' wss: https://accounts.google.com; frame-src 'self' https://accounts.google.com https://oauth.telegram.org https://calendar.google.com https://docs.google.com https://drive.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Камера, микрофон и показ экрана нужны созвонам — только нашим страницам. Геолокация не нужна никому.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(self)" always;
