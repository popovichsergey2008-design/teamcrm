# crm-web — отдаёт собранный React SPA с history-fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # статика с долгим кэшем
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
