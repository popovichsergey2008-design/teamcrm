name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, test, e2e, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: teamcrm
          POSTGRES_PASSWORD: teamcrm
          POSTGRES_DB: teamcrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teamcrm" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: teamcrm
          RABBITMQ_DEFAULT_PASS: teamcrm
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 15s
          --health-timeout 10s --health-retries 5
    env:
      DATABASE_URL: postgres://teamcrm:teamcrm@localhost:5432/teamcrm
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://teamcrm:teamcrm@localhost:5672
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: '900'
      JWT_REFRESH_TTL: '2592000'
      CORS_ORIGIN: http://localhost:5173
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: teamcrm
      MINIO_ROOT_PASSWORD: teamcrm12345
      MINIO_BUCKET: teamcrm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MinIO (official image requires a command → run as step, not service)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=teamcrm -e MINIO_ROOT_PASSWORD=teamcrm12345 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break || sleep 2
          done
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: migrate
        run: npm run migrate
      - name: e2e (live PG/Redis/RabbitMQ)
        run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend — lint, check, contrast, a11y, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: check (логика роутера, командной строки и кэша)
        run: npm run check
      - name: contrast (WCAG AA по обеим темам)
        run: npm run contrast
      - name: focus (видимое кольцо у всего кликабельного)
        run: npm run a11y
      - run: npm run build

  deploy:
    name: Deploy to staging
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync code to server
        # --delete держит дерево сервера равным репозиторию: без него удалённый в git файл
        # остаётся на проде навсегда. Удаление работает только внутри backend/, frontend/
        # и nginx/ — .env, observability/, backups/, scripts/ лежат уровнем выше и не
        # затрагиваются. Два каталога внутри nginx/ живут на сервере и в git их нет:
        # certs/ (самоподписанный сертификат edge-nginx, без него nginx не стартует) и
        # html/.well-known/ (webroot ACME — снести его значит убить автопродление
        # сертификата teamsmrt.com). Оба защищены исключениями.
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude coverage \
            --exclude .git --exclude '.env' --exclude certs --exclude '.well-known' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend frontend infra/docker-compose.yml infra/nginx \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/teamcrm/"
      - name: Build & restart stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /opt/teamcrm
            sed -i "s/\r$//" backend/docker/entrypoint.sh
            docker compose build crm-api crm-web
            docker compose up -d           # поднимает весь стек, включая новые сервисы (crm-minio)
            docker compose restart crm-edge
            docker compose ps
            # знак приложения должен быть В ОБРАЗЕ: сборка проходит и без него,
            # а на сайте по адресу иконки молча отдаётся оболочка приложения
            docker compose exec -T crm-web test -f /usr/share/nginx/html/favicon-32.png
            docker compose exec -T crm-web test -f /usr/share/nginx/html/apple-touch-icon.png
            docker compose exec -T crm-web test -f /usr/share/nginx/html/logo-mark.png
          '
