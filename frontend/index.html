<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: рисуем под «чёлку» и полосу жестов и сами отступаем на
         safe-area; interactive-widget=resizes-content: открытая клавиатура сжимает
         страницу, а не накрывает поле ввода (Chrome на Android). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>QEVO</title>

    <!-- Знак вкладки — знак QEVO без букв (просьба заказчика). Только png: знак растровый,
         svg-версии у него нет. Собирается scripts/brand-assets.py из исходника.
         Два размера: 32 для вкладки, 64 для закладок и панели задач.
         apple-touch-icon отдельно: iOS не берёт ни манифест, ни мелкие иконки. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Цвет строки браузера на телефоне — фон страницы своей темы: светлый бежевый или
         графит. Прежний почти чёрный был под неоновый знак старого бренда. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d2026" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
