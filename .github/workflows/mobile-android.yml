name: Mobile — Android APK

# Оболочка Capacitor (ТЗ-9, волна 2): собираем веб-бандл в режиме capacitor, кладём его в
# нативный проект и собираем отладочный APK. Артефакт — для установки на телефон и проверки.
# Подписанный release-APK и раздача с сайта — волна 12.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # Capacitor CLI 8 требует Node ≥ 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/native/android/**/*.gradle', 'frontend/native/android/gradle/wrapper/gradle-wrapper.properties') }}
      - run: npm ci
      - name: Веб-бандл для оболочки
        run: npm run build:capacitor
      - name: Бандл и плагины → нативный проект
        run: npx cap sync android
      - name: Ключ подписи из секретов
        # Релизный ключ живёт в секретах репозитория (и у заказчика в резерве). Потерять его —
        # значит не суметь обновить уже установленные приложения: App Links и обновления
        # сверяются по отпечатку именно этого ключа.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Сборка APK (debug + подписанный release)
        working-directory: frontend/native/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anthill-android-debug
          path: frontend/native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: anthill-android-release
          path: frontend/native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30