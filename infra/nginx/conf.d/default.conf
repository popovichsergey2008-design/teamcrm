# QEVO edge nginx.
# Маршрутизация: / → SPA (crm-web), /api/ + /socket.io/ → API (crm-api).
# TLS: Let's Encrypt для qevo.one, anthill.team и teamsmrt.com (webroot-обновление),
# self-signed — фолбэк для доступа по IP.
#
# Домены (с 26.10.2026): app.qevo.one — CRM; корень qevo.one отдан под сайт компании
# (WordPress, позже), пока его страницы ведут на app.qevo.one (301). Прежние адреса —
# qevo.one, anthill.team, teamsmrt.com — не выключаем: на них разосланы ссылки на задачи,
# гостевые ссылки на созвоны и подписки календаря, а установленные приложения ходят
# в API по старому адресу — машинные пути на них обязаны продолжать работать.

# Адреса контейнеров разрешаются НА КАЖДЫЙ запрос, а не один раз при старте.
#
# Раньше здесь стояли upstream-блоки, и nginx запоминал IP контейнера при загрузке
# конфигурации. После пересборки контейнер получает новый адрес, nginx продолжал
# ходить по старому — поэтому выкладка заканчивалась `docker compose restart
# crm-edge`. Этот перезапуск и был главной болью: он рвал ВСЕ соединения разом —
# созвоны, сокеты, загрузки файлов, — и на секунду вся CRM отвечала 502.
#
# С резолвером докера (127.0.0.11) и именем в переменной nginx перечитывает адрес
# сам, раз в десять секунд. Перезапускать его больше незачем: правки конфигурации
# применяются мягким `nginx -s reload`, при котором старые соединения доживают своё.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Сайт компании (WordPress, отдельный стек /opt/qevo-site, сеть qevo-site-web) — с 26.10.2026
# на корне qevo.one. Пути, которые были страницами CRM до переезда на app.qevo.one,
# ведут туда: на них разосланы ссылки в письмах и Telegram. WordPress эти адреса не занимает.
map $uri $crm_legacy_path {
    default 0;
    ~^/(focus|tasks|projects|news|chat|chats|settings|console|clients|onboarding|meetings|postcall|secretary|support|cabinet|calendar|get|get-app|pulse|team|reports|boards|inbox|approvals|knowledge)(/|$) 1;
}

# Куда вести со старого домена: поддомен — на такой же поддомен нового (консоль
# техотдела и dev-интерфейс), всё остальное — на основной адрес.
map $host $qevo_host {
    console.anthill.team console.qevo.one;
    dev.anthill.team     dev.qevo.one;
    default              app.qevo.one;
}

# Общие прокси-локейшены (переиспользуются в HTTPS-серверах).
# Имена контейнеров — из одного файла на оба сервера (см. include ниже).

# ── HTTP :80 — ACME-челлендж (webroot) + редирект на HTTPS ──
server {
    listen 80 default_server;
    server_name _;

    # ACME HTTP-01: должен обслуживаться по HTTP и НЕ редиректиться (нужно для выпуска и авто-обновления).
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS :443 default — self-signed фолбэк (доступ по IP / неизвестный host); nginx стартует всегда ──
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Какой цвет живой — синий или зелёный. Файл пишет deploy/release.sh, а
    # мягкий reload подхватывает его без обрыва соединений. В нём две строки:
    #   set $api_upstream crm-api-<цвет>:3000;  set $web_upstream crm-web-<цвет>:80;
    include /etc/nginx/state/color.inc;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Через это место ходят записи созвонов, вложения задач и голосовые команды.
        # Умолчание nginx — 1 МБ: пятиминутная надиктовка (3–5 МБ) отбивалась с 413,
        # и человек видел красную ошибку после пяти минут диктовки. 64 МБ — с запасом
        # к пределу Whisper (25 МБ на файл), дальше режем аудио сами.
        client_max_body_size 420m;  # #4692: видео до 400 МБ (сервер сожмёт)
        # Расшифровка и разбор длинной записи идут дольше минуты — умолчания в 60 с
        # хватало ровно до первой настоящей задачи.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws/meet {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ── Метрики приложения :9113 — только внутри docker-сети ──
#
# Порт не опубликован наружу: его видно лишь оттуда, где стоит Prometheus. Класть
# метрики на порт 80 нельзя — он опубликован на 8080 и доступен из интернета, а длина
# очереди поддержки и состояние модели наружу не нужны никому.
#
# Ходим через edge, а не прямо в контейнер приложения, ради одной вещи — ЦВЕТА. Живой
# цвет знает только nginx (state/color.inc); две постоянных цели (blue и green) дали бы
# вечно падающую цель у выключенного цвета, а на `up == 0` у нас висит критический алерт.
server {
    listen 9113;
    server_name _;

    include /etc/nginx/state/color.inc;

    location = /metrics {
        proxy_pass http://$api_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}

# ── HTTPS :443 — боевой домен anthill.team (Let's Encrypt) ──
#
# console.anthill.team — тот же сайт для техотдела вендора (ТЗ-8): отдельный адрес,
# чтобы консоль поддержки не мелькала у клиентов в закладках и в адресной строке.
# Отдельного server-блока он не заслуживает: приложение то же самое, а фронт сам
# открывает раздел «Консоль», увидев это имя в адресе. Права проверяет сервер —
# поддомен здесь про удобство и приличия, а не про безопасность.
#
# Имя стоит в server_name ДО выпуска сертификата намеренно: так nginx поднимается в
# любом случае, а сертификат расширяется отдельным шагом (deploy/console-domain.sh)
# после появления A-записи. Обратный порядок — добавить сюда ssl_certificate на ещё
# не выпущенный файл — уронил бы весь сайт.
# ── HTTPS :443 — app.qevo.one: CRM (с 26.10.2026; до того жила на корне qevo.one) ──
server {
    listen 443 ssl;
    http2 on;
    server_name app.qevo.one console.qevo.one;

    ssl_certificate     /etc/letsencrypt/live/qevo.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qevo.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Какой цвет живой — синий или зелёный. Файл пишет deploy/release.sh, а
    # мягкий reload подхватывает его без обрыва соединений. В нём две строки:
    #   set $api_upstream crm-api-<цвет>:3000;  set $web_upstream crm-web-<цвет>:80;
    include /etc/nginx/state/color.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ACME-обновление продолжает работать и на этом сервере (renew ходит по HTTP, но подстрахуемся).
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # #4680: юридические документы доступны и на поддомене приложения. Тексты живут на
    # сайте (WordPress), здесь — переход на них; своя у приложения только /legal/privacy
    # и /legal/remote-support (их показывает само приложение).
    location ~ ^/legal/(offer|terms|license|consent|cookies|warranty|metrics)/?$ {
        return 302 https://qevo.one/legal/$1/;
    }
    location = /legal { return 302 https://qevo.one/legal/; }
    location = /legal/ { return 302 https://qevo.one/legal/; }

    # Раздача Android-приложения с сайта (ТЗ-9, волна 12): APK и latest.json кладёт CI
    # в nginx/html/app/ на сервере. В git их нет, rsync их не трогает; API читает
    # latest.json из того же каталога, чтобы знать текущий выпуск.
    location ^~ /app/ {
        root /usr/share/nginx/html;
        types { application/vnd.android.package-archive apk; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # Черновики рекламных страниц на утверждение (14.10): файлы кладутся руками в
    # nginx/html/promo/ на сервере, в git их нет, rsync их не трогает. Поисковикам — нет.
    location ^~ /promo/ {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Через это место ходят записи созвонов, вложения задач и голосовые команды.
        # Умолчание nginx — 1 МБ: пятиминутная надиктовка (3–5 МБ) отбивалась с 413,
        # и человек видел красную ошибку после пяти минут диктовки. 64 МБ — с запасом
        # к пределу Whisper (25 МБ на файл), дальше режем аудио сами.
        client_max_body_size 420m;  # #4692: видео до 400 МБ (сервер сожмёт)
        # Расшифровка и разбор длинной записи идут дольше минуты — умолчания в 60 с
        # хватало ровно до первой настоящей задачи.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws/meet {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Гостевые страницы встреч (ТЗ-28, п. 55–56): приватные встречи поисковикам не показываем
    location ^~ /meet/ {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ── HTTPS :443 — корень qevo.one и www: место сайта компании; CRM уехала на app.qevo.one ──
#
# Пока сайта нет, страницы ведут на тот же путь app.qevo.one (301): ссылка на задачу
# из старого письма открывает ту же задачу. Машинные адреса — НЕ редирект, а прежнее
# обслуживание: старые приложения ходят сюда в API, сокеты и за обновлениями (архив
# обновления по воздуху качается без перехода по редиректу), Google Calendar и Telegram
# считают 301 ошибкой, вебхуки YouGile/Битрикса и отписки в письмах — с этим адресом.
#
# С 26.10 здесь WordPress (последний `location /`). /api/, /socket.io/, /ws/meet, /app/,
# /meet/, /.well-known/ и /promo/ — НЕ трогать: их адреса разосланы наружу и живут дольше
# любого сайта; WordPress их не занимает (его API — /wp-json).
server {
    listen 443 ssl;
    http2 on;
    server_name qevo.one www.qevo.one;

    ssl_certificate     /etc/letsencrypt/live/qevo.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qevo.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/state/color.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # www — на корень (задача #1366); сайт компании решит, нужен ли ему www
    if ($host = www.qevo.one) { return 301 https://qevo.one$request_uri; }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok
"; add_header Content-Type text/plain; }

    # App Links старых приложений проверяют файлы на этом домене
    location ^~ /.well-known/ {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # APK, latest.json и архивы обновления по воздуху — старые приложения берут их здесь
    location ^~ /app/ {
        root /usr/share/nginx/html;
        types { application/vnd.android.package-archive apk; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # Рекламные страницы — место им как раз на корне домена
    location ^~ /promo/ {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 420m;  # #4692: видео до 400 МБ (сервер сожмёт)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws/meet {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Гостевые ссылки на созвоны: открытая у гостя страница живёт на этом адресе
    # (вход гостя хранится по адресу) — обслуживаем, а не уводим
    location ^~ /meet/ {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Сайт компании — WordPress. Старые адреса страниц CRM (и ссылки-приглашения
    # «/?invite=…», сброс пароля, вход в созвон) — на app.qevo.one с тем же путём.
    location / {
        if ($crm_legacy_path) { return 301 https://app.qevo.one$request_uri; }
        if ($args ~* "(^|&)(invite|reset|join|register)=") { return 301 https://app.qevo.one$request_uri; }
        set $site_upstream qevo-site-wp:80;
        proxy_pass http://$site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64m;
        proxy_read_timeout 120s;
    }
}

# ── HTTPS :443 — db.qevo.one: Adminer базы сайта компании (только база WordPress) ──
#
# Для стороннего программиста сайта. Два замка: пароль nginx (файл в nginx/certs —
# выкладка этот каталог не трогает) и пароль самой базы WordPress. Базы CRM отсюда
# не видно: Adminer живёт в сетях сайта. После запуска сайта адрес можно закрыть —
# убрать этот блок и остановить контейнер qevo-site-adminer.
server {
    listen 443 ssl;
    http2 on;
    server_name db.qevo.one;

    ssl_certificate     /etc/letsencrypt/live/qevo.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qevo.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location / {
        auth_basic "QEVO site DB";
        auth_basic_user_file /etc/nginx/certs/site-adminer.htpasswd;
        set $adminer_upstream qevo-site-adminer:8080;
        proxy_pass http://$adminer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 256m;   # импорт дампа базы
        proxy_read_timeout 300s;
    }
}

# ── HTTPS :443 — dev.qevo.one (был dev.anthill.team): новый интерфейс до выхода на прод (ТЗ-15) ──
#
# Переход интерфейса на shadcn/ui идёт в ветке ui-v2 и выкладывается сюда, а не на
# anthill.team. Сервер тот же: API, сокеты и созвоны — живые, данные — настоящие.
# Меняется только сборка интерфейса: её кладёт CI (job deploy-dev) в nginx/html/dev-ui,
# и отдаёт её сам edge, без отдельного контейнера и без выкладки API.
#
# Вход — отдельный: токены лежат в localStorage, а у поддомена он свой. Поисковикам
# адрес не показываем.
server {
    listen 443 ssl;
    http2 on;
    server_name dev.qevo.one;

    ssl_certificate     /etc/letsencrypt/live/qevo.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qevo.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/state/color.inc;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 420m;  # #4692: видео до 400 МБ (сервер сожмёт)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws/meet {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Сборка интерфейса — как в crm-web (frontend/nginx.conf): готовые .gz, оболочка
    # без кэша, хэшированные файлы навсегда, файл с расширением оболочкой не подменяем.
    root /usr/share/nginx/html/dev-ui;
    index index.html;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~* \.(svg|png|ico|jpg|jpeg|gif|webp|json|webmanifest|txt|xml|woff2?|map)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS :443 — прежний домен anthill.team (до 08.10.2026): страницы — на app.qevo.one ──
#
# Так же, как teamsmrt.com ниже: людей уводим на новый адрес постоянным редиректом с
# сохранением пути (ссылка на задачу ведёт на ту же задачу), а машинные адреса
# обслуживаем как прежде. На anthill.team смотрят установленные приложения (API и
# проверка обновлений в бандле), вебхук Telegram, подписки календаря, гостевые созвоны
# и подтверждение App Links (.well-known) — редирект их бы сломал.
server {
    listen 443 ssl;
    http2 on;
    server_name anthill.team www.anthill.team console.anthill.team dev.anthill.team;

    ssl_certificate     /etc/letsencrypt/live/anthill.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anthill.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/state/color.inc;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # App Links / Universal Links старых приложений проверяют файлы на этом домене
    location ^~ /.well-known/ {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # APK и latest.json: старые приложения проверяют обновления здесь
    location ^~ /app/ {
        root /usr/share/nginx/html;
        types { application/vnd.android.package-archive apk; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 420m;  # #4692: видео до 400 МБ (сервер сожмёт)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws/meet {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / { return 301 https://$qevo_host$request_uri; }
}

# ── HTTPS :443 — прежний домен teamsmrt.com: ведёт на app.qevo.one ──
#
# Редирект, а не выключение: на старый адрес уже разосланы ссылки на задачи в письмах,
# гостевые ссылки на созвоны и подписки календаря — они должны продолжать открываться.
# Путь и строка запроса сохраняются: ссылка на конкретную задачу ведёт на неё же.
#
# Код 301 (а не 302) — постоянный: браузеры и внешние читатели (Google Calendar,
# Telegram) запомнят новый адрес и перестанут ходить на старый.
#
# ACME-челлендж НЕ редиректим: сертификат старого домена продолжает обновляться,
# иначе редирект однажды сломается вместе с истёкшим сертификатом.
server {
    listen 443 ssl;
    http2 on;
    server_name teamsmrt.com www.teamsmrt.com;

    ssl_certificate     /etc/letsencrypt/live/teamsmrt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamsmrt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Какой цвет живой. Нужен и здесь: со старого домена продолжают ходить машины,
    # и без этого файла переменная адреса контейнера остаётся пустой — nginx отвечает
    # 500 на каждый такой запрос.
    include /etc/nginx/state/color.inc;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Машинные адреса со старого домена НЕ редиректим, а обслуживаем как прежде.
    #
    # Редирект понимают браузеры, а внешние службы — нет: Telegram считает 301
    # неудачной доставкой вебхука, Google Calendar перестаёт читать подписку .ics,
    # а уже выданные гостевые ссылки на созвоны рвут сокет. Эти адреса разосланы
    # наружу и живут дольше нашего переезда, поэтому старый домен остаётся рабочим
    # входом для машин — и только страницы уводит на новый адрес.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 420m;  # #4692: видео до 400 МБ (сервер сожмёт)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws/meet {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # сразу на новый адрес, без второго прыжка через anthill.team и qevo.one
    location / { return 301 https://app.qevo.one$request_uri; }
}
