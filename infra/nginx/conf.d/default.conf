# TEAMCRM edge nginx.
# Маршрутизация: / → SPA (crm-web), /api/ + /socket.io/ → API (crm-api).
# TLS: Let's Encrypt для teamsmrt.com (webroot-обновление), self-signed — фолбэк для доступа по IP.

upstream crm_api { server crm-api:3000; }
upstream crm_web { server crm-web:80; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Общие прокси-локейшены (переиспользуются в HTTPS-серверах).
# NB: nginx не поддерживает include-переменные для upstream — дублируем явно.

# ── HTTP :80 — ACME-челлендж (webroot) + редирект на HTTPS ──
server {
    listen 80 default_server;
    server_name _;

    # ACME HTTP-01: должен обслуживаться по HTTP и НЕ редиректиться (нужно для выпуска и авто-обновления).
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS :443 default — self-signed фолбэк (доступ по IP / неизвестный host); nginx стартует всегда ──
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://crm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://crm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://crm_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ── HTTPS :443 — боевой домен (Let's Encrypt) ──
server {
    listen 443 ssl;
    http2 on;
    server_name teamsmrt.com www.teamsmrt.com;

    ssl_certificate     /etc/letsencrypt/live/teamsmrt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamsmrt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ACME-обновление продолжает работать и на этом сервере (renew ходит по HTTP, но подстрахуемся).
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://crm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://crm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://crm_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
